apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hello-world-ops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'hello-world-ops'
        static_configs:
          - targets: ['hello-world-ops-service:8090']
        metrics_path: /metrics
        scrape_interval: 10s 